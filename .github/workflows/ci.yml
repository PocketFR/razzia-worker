name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    name: Types, style et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 22 : c'est la version sous laquelle le déploiement fonctionne.
      # Wrangler part en erreur de segmentation sous node 26 dès le premier
      # appel à l'API Cloudflare. Rien ici n'appelle Cloudflare, mais autant
      # éprouver l'application sur la version qui sert vraiment.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      # tsc -b, et non tsc -p : la configuration du paquet web déclare
      # « files: [] », si bien que -p ne vérifierait rigoureusement rien.
      - name: Types
        run: pnpm run typecheck

      # Les suites qui n'ont pas besoin d'un serveur. Les smoke-* exigent un
      # « wrangler dev » et une base peuplée : elles se lancent à la main,
      # voir docs/deploiement.md.
      - name: Tests unitaires
        working-directory: packages/worker
        run: |
          npx tsx scripts/test-quizia.ts
          npx tsx scripts/test-branding.mts
          npx tsx scripts/test-socket-client.mts
          npx tsx scripts/test-rattrapage.mts
          npx tsx scripts/test-enchainement-auto.mts
