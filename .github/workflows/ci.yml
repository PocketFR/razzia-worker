name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    name: Types, style et tests unitaires (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Les deux bornes de ce qui est annoncé : le minimum documenté, et la
    # version utilisée en développement. Une affirmation sur une version de
    # node a déjà survécu des semaines dans ce dépôt sans être vraie — autant
    # que la CI la vérifie.
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format
        run: pnpm format

      # NON BLOQUANT, et c'est une dette assumée plutôt qu'un oubli. Le paquet
      # worker n'avait jamais été passé au linter : il reste 241 signalements,
      # presque tous de style, dans du code écrit pour ce portage. Les rendre
      # bloquants aujourd'hui rendrait la CI rouge en permanence, ce qui revient
      # à ne plus la lire. Le compte doit descendre, pas la règle disparaître.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      # tsc -b, et non tsc -p : la configuration du paquet web déclare
      # « files: [] », si bien que -p ne vérifierait rigoureusement rien.
      - name: Types
        run: pnpm run typecheck

      # Les suites qui n'ont pas besoin d'un serveur. Les smoke-* exigent un
      # « wrangler dev » et une base peuplée : elles se lancent à la main,
      # voir docs/deploiement.md.
      - name: Tests unitaires
        working-directory: packages/worker
        run: |
          npx tsx scripts/test-quizia.ts
          npx tsx scripts/test-branding.mts
          npx tsx scripts/test-socket-client.mts
          npx tsx scripts/test-rattrapage.mts
          npx tsx scripts/test-enchainement-auto.mts
