name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    name: Types, style et tests unitaires (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Les deux bornes de ce qui est annoncé : le minimum documenté, et la
    # version utilisée en développement. Une affirmation sur une version de
    # node a déjà survécu des semaines dans ce dépôt sans être vraie — autant
    # que la CI la vérifie.
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      # tsc -b, et non tsc -p : la configuration du paquet web déclare
      # « files: [] », si bien que -p ne vérifierait rigoureusement rien.
      - name: Types
        run: pnpm run typecheck

      # Les suites qui n'ont pas besoin d'un serveur. Les smoke-* exigent un
      # « wrangler dev » et une base peuplée : elles se lancent à la main.
      # smoke-fin-interlude.mjs en fait partie : c'est le seul endroit où
      # l'enchaînement entre l'écran de l'animateur et le serveur se vérifie.
      - name: Tests unitaires
        working-directory: packages/worker
        run: |
          npx tsx scripts/test-quizia.ts
          npx tsx scripts/test-branding.mts
          npx tsx scripts/test-socket-client.mts
          npx tsx scripts/test-rattrapage.mts
          npx tsx scripts/test-enchainement-auto.mts
          npx tsx scripts/test-arborescence.mts
          npx tsx scripts/test-paris.mts
          npx tsx scripts/test-validateurs.mts
          npx tsx scripts/test-branding-variantes.mts
          npx tsx scripts/test-securite.mts
          npx tsx scripts/test-musique.mts
          npx tsx scripts/test-branding-cache.mts
          npx tsx scripts/test-alarme.mts

      # L'éditeur monté dans jsdom et cliqué. Ce panneau m'a échappé trois fois
      # de suite : un typecheck vert n'y prouve rien, seul un clic le fait.
      - name: Tests de l'interface
        run: pnpm --filter @razzia/web test
